name: Download new assets

# Refreshes the EN gamedata dump (text and JSON) straight from the game servers. This is
# the only source of the data: the parent repository is no longer synced.
#
# Differences from the workflow inherited from the parent repository:
#   - 24 hour cadence instead of 10 minutes: the dump changes on patch, not per minute.
#     It runs at 12:00 UTC because updates usually land around 06:00 UTC and a major one
#     keeps the game servers closed until about 10:00, delays possible, so 12:00 leaves
#     room for that while still being the same day.
#   - no --force: arkprts compares the hot_update_list.json committed under <server>/
#     with the server's own and downloads only the bundles whose hash changed. The
#     inherited --force re-downloaded all six servers on every run and discarded that
#     mechanism.
#   - the target server is `en` by default. It used to be derived from the branch name,
#     and on `master` that expression evaluated to `all`, which would have downloaded
#     bili/, cn/, jp/, kr/ and tw/ and committed them, restoring the five directories
#     this branch removed on purpose. `all` is still reachable, but only as an explicit
#     manual dispatch input.
#   - extraction failures, which arkprts only logs, are reported in the run summary and
#     fail the job instead of being swallowed.
#
# The updater only ever writes: it downloads the outdated bundles, extracts them and
# saves the new hot_update_list.json. It has no deletion path, which is why the 33 story
# files listed in tools/preserved_files.txt, absent upstream but kept here, survive every
# run.

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Which server dump to refresh"
        type: choice
        options: [en, all]
        default: en
  schedule:
    - cron: '0 12 * * *'

concurrency:
  group: update-assets-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install arkprts
        run: python -m pip install "arkprts[all]"

      - name: Install flatc
        run: |
          wget -q -O flatc https://raw.githubusercontent.com/MooncellWiki/torappu/37e645f4528248b639b63c35dbb63ee7ae64a315/bin/flatc
          chmod +x flatc && sudo mv flatc /usr/bin/flatc

      - name: Update files
        id: update
        run: |
          set -o pipefail
          # Defaults to `en`: these branches carry only the English dump, and `all`
          # would restore the five server directories that were removed on purpose.
          SERVERS="${{ inputs.server || 'en' }}"
          echo "servidores: $SERVERS"
          # sem --force: atualizacao incremental pelo hot_update_list.json versionado
          python -m arkprts.assets . --server "$SERVERS" --log-level DEBUG 2>&1 | tee /tmp/arkprts.log

      - name: Report extraction failures
        if: always()
        run: |
          {
            echo "### Extracao"
            echo ""
            echo "- arquivos com falha de extracao: $(grep -c 'Failed to extract asset' /tmp/arkprts.log || true)"
            echo "- containers nao reconhecidos: $(grep -c 'Unrecognized container' /tmp/arkprts.log || true)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on extraction errors
        run: |
          if grep -q 'Failed to extract asset' /tmp/arkprts.log; then
            echo "extracao falhou em pelo menos um bundle; ver o log do passo anterior"
            grep 'Failed to extract asset' /tmp/arkprts.log | head -20
            exit 1
          fi

      - name: Save FBS version
        run: |
          version=$(cat ~/.local/share/arkprts/ArknightsFBS/cn/OpenArknightsFBS/commit.txt 2>/dev/null || echo unknown),$(cat ~/.local/share/arkprts/ArknightsFBS/yostar/OpenArknightsFBS/commit.txt 2>/dev/null || echo unknown),$(cat ~/.local/share/arkprts/ArknightsFlatbuffers/commit.txt 2>/dev/null || echo unknown)
          echo "$version" > fbs_version.txt

      - name: Format files
        run: |
          find . -path '*/gamedata/excel/*.json' -exec python -m json.tool {} {} --no-ensure-ascii \;
          find . -path '*/gamedata/levels/enemydata/enemy_database.json' -exec python -m json.tool {} {} --no-ensure-ascii \;

      - name: Check changed directories
        run: |
          git add . && echo "CHANGED_SERVERS=$(git status --porcelain | grep -o -E '(^| )(bili|cn|en|jp|kr|tw)/' | tr -d ' ' | sed 's|/$||' | sort -u | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_ENV

      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Arknights update ${{ env.CHANGED_SERVERS }}
