name: Sync from upstream

# Traz os dados do repositorio pai (ArknightsAssets/ArknightsGamedata) para o branch de
# dados deste fork, de forma incremental e sem merge.
#
# Por que nao usar merge nem o "Sync fork" do GitHub:
#   - o branch EN removeu de proposito bili/, cn/, jp/, kr/ e tw/, mas o pai continua
#     alterando esses arquivos. Um merge gera conflitos modify/delete em todos eles
#     (medido: 30 conflitos, todos em bili/ e cn/) e, pior, aplica em silencio as
#     delecoes que o pai fez dentro de en/ (medido: 33 arquivos que este fork restaurou)
#   - o fast-forward do GitHub nao e possivel no branch EN, que tem commits locais
#
# O que este workflow faz (tools/sync_upstream.sh):
#   1. busca o branch do pai
#   2. avanca o branch espelho (`upstream`) por fast-forward, mantendo o historico
#      completo do pai disponivel no fork. O espelho passou a morar em `upstream`
#      porque `master` virou o branch de dados e tem commits que o pai nao tem, o que
#      fazia o script recusar o avanco com "espelho nao sera forcado"
#   3. copia en/ e fbs_version.txt do pai para o branch de dados. Esses sao os unicos
#      caminhos tocados: bili/, cn/, jp/, kr/ e tw/ nunca sao restaurados, porque nao
#      estao na lista de caminhos do sync
#   4. aplica as delecoes do pai dentro de en/, exceto os caminhos listados em
#      tools/preserved_files.txt, que sao restaurados
#   5. commita e publica, registrando o commit do pai na mensagem

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apenas relatar o que mudaria, sem commitar"
        type: boolean
        default: false
  schedule:
    - cron: '42 2 * * *'

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync from upstream
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          UPSTREAM_URL: https://github.com/ArknightsAssets/ArknightsGamedata.git
          UPSTREAM_BRANCH: master
          DATA_BRANCH: master
          MIRROR_BRANCH: upstream
        run: bash tools/sync_upstream.sh
