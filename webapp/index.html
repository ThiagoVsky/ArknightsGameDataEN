<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arknights Data Mapper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="padding: 10px; background-color: var(--panel-bg); border-bottom: 1px solid var(--border-color);">
        <input type="text" id="global-search" placeholder="Search across all data..." style="width: 50%; max-width: 500px; margin-bottom: 0;">
    </div>
    <div class="container">
        <!-- Panel 1: Entity Types -->
        <div class="panel" id="panel-types">
            <h2>Entity Types</h2>
            <ul id="type-list"></ul>
        </div>

        <!-- Panel 2: Entity List -->
        <div class="panel" id="panel-entities">
            <h2 id="current-type">Select a type</h2>
            <div class="controls">
                <input type="text" id="search-entities" placeholder="Search entities...">
                <select id="sort-entities">
                    <option value="name">Sort by Name</option>
                    <option value="id">Sort by ID</option>
                </select>
            </div>
            <div id="entity-count-msg" class="msg"></div>
            <ul id="entity-list"></ul>
        </div>

        <!-- Panel 3: Entity Details -->
        <div id="panel-stack" style="display: flex; flex: 3; overflow-x: auto;">
            <div class="panel pane-stack-member" id="panel-details">
                <h2>Entity Details</h2>
                <div id="details-content">
                    <p>Select an entity to view details.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
